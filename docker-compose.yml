services:
  kestrelsdev.fileapi:
    image: ghcr.io/kestrelsdevelopment/kestrelsdev.imageapi
    environment:
      - REDIS_URL=redis://cache:6379
    volumes:
      - ./images:/images
    ports:
      - 3000:3000
    build:
      context: .
      dockerfile: ./Dockerfile
  cache:
    image: valkey/valkey:8.0-alpine
    container_name: image-cache
    command: valkey-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
     - 6379:6379
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5